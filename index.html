<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mazama Cameras</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://nickhillyer.github.io/mazama-cameras/goat.png">
    <link rel="apple-touch-icon" href="https://nickhillyer.github.io/mazama-cameras/goat.png">
    <style>
        :root {
            --brand-orange: #fc6f03;
            --bg-dark: #1a1a1a;
            --text-light: #eeeeee;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: baseline; 
            flex-wrap: wrap;
            gap: 10px;
        }

        .pageTitle {
            color: var(--brand-orange);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0;
            font-variant: small-caps;
            line-height: 1;
        }

        .camera-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .cam-link {
            text-decoration: none;
            display: block;
        }

        .cam-link[hidden] {
            display: none;
        }

        .cam-label {
            padding-bottom: 4px;
            color: #aaa;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .img-wrapper {
            background: #000;
        }

        .cam-link img {
            width: 100%;
            display: block;
        }

        @media (min-width: 700px) {
            .camera-grid {
                grid-template-columns: 1fr 1fr;
            }

            .cam-link.full-width {
                grid-column: span 2;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="pageTitle">Mazama Cameras</h1>
    </header>

    <div class="camera-grid" id="camera-container"></div>
</div>

<script>

    // Set width to "full" or "half" for the two-column desktop layout.
    const cameras = [
        { name: "Mazama Ranch House", url: "https://mazamaranchhouse.com/webcam", img: "https://mazamacam.earthandskystudios.com/content/ranchhouseimg.jpg", width: "full" },
        { name: "Sun Mountain", url: "https://sunmountainlodge.com/webcam", img: "https://sunmountainlodge.com/wp-content/uploads/webcam/smlcam.jpg", width: "full" },
        { name: "Edelweiss", url: "http://highlandmeadow.homelinux.org", img: "https://wsrv.nl/?url=highlandmeadow.homelinux.org", width: "half" },
        { name: "Mazama Snow Stake", url: "https://stake-images.sfo3.digitaloceanspaces.com/mazama/latest/stake_image.jpg", img: "https://stake-images.sfo3.digitaloceanspaces.com/mazama/latest/stake_image.jpg", width: "half" },
        { name: "Winthrop", url: "https://wsdot.com/travel/real-time/mountainpasses/north-cascade-hwy", img: "https://images.wsdot.wa.gov/nc/020vc19255.jpg", width: "half" },
        { name: "Loup Loup Pass", url: "https://wsdot.com/travel/real-time/mountainpasses/Loup-Loup", img: "https://images.wsdot.wa.gov/nc/020vc21450.jpg", width: "half" },
        { name: "Snoqualmie Pass", url: "https://wsdot.com/travel/real-time/mountainpasses/Snoqualmie", img: "https://images.wsdot.wa.gov/sc/090VC05200.jpg", width: "half" },
        { name: "Stevens Pass", url: "https://wsdot.com/travel/real-time/mountainpasses/Stevens", img: "https://images.wsdot.wa.gov/nc/002vc06458.jpg", width: "half" },
        { name: "Blewett Pass", url: "https://wsdot.com/travel/real-time/mountainpasses/Blewett", img: "https://images.wsdot.wa.gov/nc/097vc16375.jpg", width: "half" }
    ];

    const container = document.getElementById('camera-container');
    const cacheBuster = Date.now();

    cameras.forEach(cam => {
        const link = document.createElement('a');
        link.href = cam.url;
        link.target = "_blank";
        link.className = `cam-link ${cam.width === 'full' ? 'full-width' : 'half-width'}`;
        link.hidden = true;

        const label = document.createElement('div');
        label.className = 'cam-label';
        label.textContent = cam.name;

        const wrapper = document.createElement('div');
        wrapper.className = 'img-wrapper';
        const image = document.createElement('img');
        image.alt = cam.name;
        image.addEventListener('load', () => {
            link.hidden = false;
        });
        image.addEventListener('error', () => {
            link.hidden = true;
        });
        wrapper.appendChild(image);
        link.append(label, wrapper);
        container.appendChild(link);

        // Load hidden images eagerly so they can reveal their cards on success.
        const imageUrl = new URL(cam.img);
        imageUrl.searchParams.set('t', cacheBuster);
        image.src = imageUrl.href;
    });

</script>

</body>
</html>
